# Generated by prd_hooks.py ci --github; regenerate rather than edit.
name: prd-toolkit
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prd-lint:
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: "sh .prd-toolkit/prd lint --ci docs/prd/histand-net"
      - run: "sh .prd-toolkit/prd hooks check --ci docs/prd/histand-net"

  prd-trace:
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: "sh .prd-toolkit/prd trace docs/prd/histand-net --range ${{ github.event.pull_request.base.sha }}..HEAD"

  test-integration:
    if: "github.event_name == 'pull_request'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: "uv run --with pytest==8.3.4 --with pyyaml==6.0.2 pytest -p no:cacheprovider tests/integration --tb=short"

  test-deploy-production:
    if: "github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: "export PRD_ENV=production TEST_ENV=production; uv run --with pytest==8.3.4 --with pyyaml==6.0.2 pytest -p no:cacheprovider tests/smoke --tb=short"
