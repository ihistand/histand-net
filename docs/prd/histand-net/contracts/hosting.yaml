# Custom contract type `hosting` (prd.md section 7): the rules of how the host serves the site.
# Shape: scripts/prd/validate_hosting.py. One top-level key per rule:
#   <name>: {rule: clean-urls | redirect | rewrite | not-deployed | crawl, config, ...the rule's own keys}
# No not-deployed rule yet: FR-010 (AC-010.2, AC-010.3) asks for a .vercelignore that leaves out the files
# that are not the site, and the validator needs that config file to exist, so the rule is written when it is.
clean-urls:
  rule: clean-urls
  config: vercel.json
  enabled: true
family-to-root:
  rule: redirect
  config: vercel.json
  from-path: /family
  to: /
  permanent: true
  keeps-path: false
ivan-to-subdomain:
  rule: redirect
  config: vercel.json
  from-host: histand.net
  from-path: /ivan
  to: "https://ivan.histand.net/"
  permanent: true
  keeps-path: false
ivan-on-subdomain-to-root:   # FR-005 AC-005.3; not in vercel.json yet (E-001, open)
  rule: redirect
  config: vercel.json
  from-host: ivan.histand.net
  from-path: /ivan
  to: "https://ivan.histand.net/"
  permanent: true
  keeps-path: false
www-histand-net-to-apex:
  rule: redirect
  config: vercel.json
  from-host: www.histand.net
  to: "https://histand.net/"
  permanent: true
  keeps-path: true
